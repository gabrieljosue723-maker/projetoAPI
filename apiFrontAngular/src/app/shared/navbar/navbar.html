<nav class="navbar">
    <a routerLink="/home" class="marca">
        <span class="marca-nome">Usados Úteis</span>
        <span class="marca-tag">marketplace</span>
    </a>

    @if (authService.estaAutenticado()) {
    <div class="links">
        <a routerLink="/home" routerLinkActive="ativo">Início</a>
        <a routerLink="/dashboard" routerLinkActive="ativo">Dashboard</a>
        <a routerLink="/lixeira" routerLinkActive="ativo">Lixeira</a>
        <a routerLink="/produtos/novo" class="link-destaque">Publicar produto</a>
    </div>

    <div class="area-utilizador">
        <div class="avatar-utilizador" [title]="authService.usuarioAtual()?.name ?? ''">
            {{ (authService.usuarioAtual()?.name ?? 'U').charAt(0).toUpperCase() }}
        </div>
        <span class="nome-utilizador">{{ authService.usuarioAtual()?.name }}</span>
        <button class="botao-sair" (click)="sair()">Sair</button>
    </div>
    }
</nav>
